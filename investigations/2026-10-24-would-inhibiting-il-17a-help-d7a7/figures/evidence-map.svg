<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 656" width="1160" height="656" role="img" aria-labelledby="em-title em-desc" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif"><title id="em-title">Evidence map: IL-17A inhibition (secukinumab) in Crohn&#39;s disease: evidence against benefit</title><desc id="em-desc">0 supporting, 3 opposing and 3 context findings linked to 5 distinct studies or records.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="40" font-size="13" font-weight="600" fill="#141A26" letter-spacing="0.08em">EVIDENCE MAP</text><text x="40" y="60" font-size="12" fill="#4A5468">Hypothesis → findings → sources. Records sharing a PMID, NCT, DOI or protocol ID are merged into one study node.</text><text x="40" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#4AB5B5">SUPPORTS · 0</text><text x="40" y="258" font-size="11.5" fill="#A7B0C0">None recorded</text><text x="430" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#6D8BC0">CONTEXT · 3</text><text x="820" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#525AFF">OPPOSES · 3</text><path d="M580,160 C580,183 500,183 500,206" fill="none" stroke="#6D8BC0" stroke-width="1.4" opacity="0.6"/><path d="M580,160 C580,183 890,183 890,206" fill="none" stroke="#525AFF" stroke-width="1.4" opacity="0.6"/><path d="M730,273 H742 V504 C742,537 156,537 156,570" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F4"/><path d="M730,361 H742 V504 C742,537 368,537 368,570" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F5"/><path d="M730,449 H742 V504 C742,537 580,537 580,570" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F6"/><path d="M1120,273 H1132 V504 C1132,537 792,537 792,570" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F1"/><path d="M1120,361 H1132 V504 C1132,537 792,537 792,570" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F2"/><path d="M1120,449 H1132 V504 C1132,537 1004,537 1004,570" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F3"/><g data-node="hypothesis"><rect x="380" y="84" width="400" height="76" rx="14" fill="#FFFFFF" stroke="#141A26" stroke-width="1.2"/><text x="398" y="106" font-size="10" letter-spacing="0.12em" fill="#4A5468">HYPOTHESIS</text><text x="762" y="106" font-size="10.5" font-weight="700" letter-spacing="0.1em" text-anchor="end" fill="#525AFF">OPPOSED</text><text x="398" y="128" font-size="13.5" font-weight="600" fill="#141A26">IL-17A inhibition (secukinumab) in Crohn&#39;s disease:</text><text x="398" y="145" font-size="13.5" font-weight="600" fill="#141A26">evidence against benefit</text></g><g data-finding="F4" tabindex="0"><title>F4 (context, observation): Open Targets gives a low overall IL17A–Crohn disease association (0.1), driven mainly by literature (0.503), with modest clinical (0.137) and RNA expression (0.126) evidence. This is a ranking, not a probability of success.</title><rect x="430" y="236" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.1"/><rect x="430" y="248" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="446" y="256" font-size="10" font-weight="700" fill="#6D8BC0" letter-spacing="0.06em">F4<tspan font-weight="500" fill="#4A5468" dx="8">observation · not applicable</tspan></text><text x="446" y="273" font-size="11.2" fill="#141A26">Open Targets gives a low overall IL17A–Crohn</text><text x="446" y="286.5" font-size="11.2" fill="#141A26">disease association (0.1), driven mainly by</text><text x="446" y="300" font-size="11.2" fill="#141A26">literature (0.503), with modest clinical (0.137…</text></g><g data-finding="F5" tabindex="0"><title>F5 (context, observation): Secukinumab is an IL-17A inhibitor antibody with max phase 4 overall (approved for psoriasis, PsA, AS), but Crohn&#39;s disease max phase is 2. Phase reflects development stage, not efficacy in Crohn&#39;s.</title><rect x="430" y="324" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.1"/><rect x="430" y="336" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="446" y="344" font-size="10" font-weight="700" fill="#6D8BC0" letter-spacing="0.06em">F5<tspan font-weight="500" fill="#4A5468" dx="8">observation · not applicable</tspan></text><text x="446" y="361" font-size="11.2" fill="#141A26">Secukinumab is an IL-17A inhibitor antibody with</text><text x="446" y="374.5" font-size="11.2" fill="#141A26">max phase 4 overall (approved for psoriasis,</text><text x="446" y="388" font-size="11.2" fill="#141A26">PsA, AS), but Crohn&#39;s disease max phase is 2…</text></g><g data-finding="F6" tabindex="0"><title>F6 (context, interpretation): An experimental 2.6 Å crystal structure of secukinumab Fv bound to human IL-17A is available (PDB 9SFX), so target engagement by this antibody is structurally characterized.</title><rect x="430" y="412" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.1"/><rect x="430" y="424" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="446" y="432" font-size="10" font-weight="700" fill="#6D8BC0" letter-spacing="0.06em">F6<tspan font-weight="500" fill="#4A5468" dx="8">interpretation · not applicable</tspan></text><text x="446" y="449" font-size="11.2" fill="#141A26">An experimental 2.6 Å crystal structure of</text><text x="446" y="462.5" font-size="11.2" fill="#141A26">secukinumab Fv bound to human IL-17A is</text><text x="446" y="476" font-size="11.2" fill="#141A26">available (PDB 9SFX), so target engagement by…</text></g><g data-finding="F1" tabindex="0"><title>F1 (opposes, observation): Secukinumab 10 mg/kg IV (days 1 and 22) did not improve CDAI vs placebo at week 6 in moderate-to-severe Crohn&#39;s disease; the change was numerically worse on drug, and the trial stopped early for futility.</title><rect x="820" y="236" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.1"/><rect x="820" y="248" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="836" y="256" font-size="10" font-weight="700" fill="#525AFF" letter-spacing="0.06em">F1<tspan font-weight="500" fill="#4A5468" dx="8">observation · negative</tspan></text><text x="836" y="273" font-size="11.2" fill="#141A26">Secukinumab 10 mg/kg IV (days 1 and 22) did not</text><text x="836" y="286.5" font-size="11.2" fill="#141A26">improve CDAI vs placebo at week 6 in</text><text x="836" y="300" font-size="11.2" fill="#141A26">moderate-to-severe Crohn&#39;s disease; the change…</text></g><g data-finding="F2" tabindex="0"><title>F2 (opposes, observation): Published report concluded IL-17A blockade with secukinumab was ineffective in active Crohn&#39;s disease, with more adverse events (including infections, with fungal infections only on drug) than placebo.</title><rect x="820" y="324" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.1"/><rect x="820" y="336" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="836" y="344" font-size="10" font-weight="700" fill="#525AFF" letter-spacing="0.06em">F2<tspan font-weight="500" fill="#4A5468" dx="8">observation · negative</tspan></text><text x="836" y="361" font-size="11.2" fill="#141A26">Published report concluded IL-17A blockade with</text><text x="836" y="374.5" font-size="11.2" fill="#141A26">secukinumab was ineffective in active Crohn&#39;s</text><text x="836" y="388" font-size="11.2" fill="#141A26">disease, with more adverse events (including…</text></g><g data-finding="F3" tabindex="0"><title>F3 (opposes, observation): Case series report new-onset or worsening IBD in patients treated with IL-17 inhibitors (including secukinumab) for psoriasis/spondyloarthritis, suggesting a possible protective role of IL-17A in the gut. Causality is not established.</title><rect x="820" y="412" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.1"/><rect x="820" y="424" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="836" y="432" font-size="10" font-weight="700" fill="#525AFF" letter-spacing="0.06em">F3<tspan font-weight="500" fill="#4A5468" dx="8">observation · not applicable</tspan></text><text x="836" y="449" font-size="11.2" fill="#141A26">Case series report new-onset or worsening IBD in</text><text x="836" y="462.5" font-size="11.2" fill="#141A26">patients treated with IL-17 inhibitors</text><text x="836" y="476" font-size="11.2" fill="#141A26">(including secukinumab) for…</text></g><g data-group="ot:ENSG00000112115:MONDO_0005011"><title>ot:ENSG00000112115:MONDO_0005011</title><rect x="58" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="76" y="589" font-size="11" font-weight="600" fill="#141A26">Open Targets</text><text x="76" y="604" font-size="10" fill="#4A5468">Open Targets</text></g><g data-group="chembl:CHEMBL1743068"><title>chembl:CHEMBL1743068</title><rect x="270" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="288" y="589" font-size="11" font-weight="600" fill="#141A26">CHEMBL1743068</text><text x="288" y="604" font-size="10" fill="#4A5468">ChEMBL</text></g><g data-group="pdb:9SFX"><title>pdb:9SFX</title><rect x="482" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="500" y="589" font-size="11" font-weight="600" fill="#141A26">PDB 9SFX</text><text x="500" y="604" font-size="10" fill="#4A5468">RCSB PDB, 2025</text></g><g data-group="C1"><title>ctgov:NCT00584740, ctgov:NCT01009281, pmid:22595313</title><rect x="694" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1"/><text x="712" y="589" font-size="11" font-weight="600" fill="#141A26">NCT00584740 · one study</text><text x="712" y="604" font-size="10" fill="#4A5468">+ NCT01009281, PMID 22595313</text></g><g data-group="pmcid:PMC7958765"><title>pmcid:PMC7958765</title><rect x="906" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="924" y="589" font-size="11" font-weight="600" fill="#141A26">PMC7958765</text><text x="924" y="604" font-size="10" fill="#4A5468">Europe PMC, 2021</text></g></svg>