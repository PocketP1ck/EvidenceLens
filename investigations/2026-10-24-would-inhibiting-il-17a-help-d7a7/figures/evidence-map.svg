<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 538" width="1160" height="538" role="img" aria-labelledby="em-title em-desc" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif"><title id="em-title">Evidence map: IL-17A inhibition (secukinumab) in Crohn&#39;s disease: evidence against benefit</title><desc id="em-desc">0 supporting, 3 opposing and 3 context findings linked to 5 distinct studies or records.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><text x="24" y="36" font-size="13" font-weight="600" fill="#141A26" letter-spacing="0.08em">EVIDENCE MAP</text><text x="24" y="56" font-size="12" fill="#4A5468">Sources merged by shared PMID / NCT / DOI. Line colour = direction relative to the hypothesis.</text><g transform="translate(800,30)"><line x1="0" y1="0" x2="22" y2="0" stroke="#4AB5B5" stroke-width="2"/><text x="30" y="4" font-size="11" fill="#4A5468">Supports</text></g><g transform="translate(910,30)"><line x1="0" y1="0" x2="22" y2="0" stroke="#525AFF" stroke-width="2"/><text x="30" y="4" font-size="11" fill="#4A5468">Opposes</text></g><g transform="translate(1020,30)"><line x1="0" y1="0" x2="22" y2="0" stroke="#6D8BC0" stroke-width="2"/><text x="30" y="4" font-size="11" fill="#4A5468">Context</text></g><path d="M580,192 L775,96" fill="none" stroke="#525AFF" stroke-width="1.4" opacity="0.55" data-finding="F1"/><path d="M580,192 L775,182" fill="none" stroke="#525AFF" stroke-width="1.4" opacity="0.55" data-finding="F2"/><path d="M580,192 L775,268" fill="none" stroke="#525AFF" stroke-width="1.4" opacity="0.55" data-finding="F3"/><path d="M580,192 L580,240" fill="none" stroke="#6D8BC0" stroke-width="1.4" opacity="0.55" data-finding="F4"/><path d="M580,192 L580,326" fill="none" stroke="#6D8BC0" stroke-width="1.4" opacity="0.55" data-finding="F5"/><path d="M580,192 L580,412" fill="none" stroke="#6D8BC0" stroke-width="1.4" opacity="0.55" data-finding="F6"/><path d="M204,275 C329.5,275 329.5,275 455,275" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F4" data-group="ot:ENSG00000112115:MONDO_0005011"/><path d="M204,361 C329.5,361 329.5,361 455,361" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F5" data-group="chembl:CHEMBL1743068"/><path d="M204,447 C329.5,447 329.5,447 455,447" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F6" data-group="pdb:9SFX"/><path d="M900,131 C928,131 928,174 956,174" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F1" data-group="C1"/><path d="M900,217 C928,217 928,174 956,174" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F2" data-group="C1"/><path d="M900,303 C928,303 928,303 956,303" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.7" data-finding="F3" data-group="pmcid:PMC7958765"/><g data-node="hypothesis"><rect x="470" y="96" width="220" height="96" rx="14" fill="#FFFFFF" stroke="#141A26" stroke-width="1.2"/><text x="486" y="118" font-size="10" letter-spacing="0.1em" fill="#4A5468">HYPOTHESIS</text><text x="486" y="138" font-size="13" font-weight="600" fill="#141A26">IL-17A inhibition</text><text x="486" y="154" font-size="13" font-weight="600" fill="#141A26">(secukinumab) in Crohn&#39;s…</text><text x="486" y="180" font-size="11" font-weight="600" fill="#525AFF">OPPOSED</text></g><g data-finding="F1" tabindex="0"><title>F1 (opposes, observation): Secukinumab 10 mg/kg IV (days 1 and 22) did not improve CDAI vs placebo at week 6 in moderate-to-severe Crohn&#39;s disease; the change was numerically worse on drug, and the trial stopped early for futility.</title><rect x="650" y="96" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.2"/><rect x="650" y="106" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="664" y="115" font-size="10" font-weight="600" fill="#525AFF" letter-spacing="0.06em">F1 · OPPOSES · observation</text><text x="664" y="131" font-size="11" fill="#141A26">Secukinumab 10 mg/kg IV (days 1 and 22)</text><text x="664" y="144" font-size="11" fill="#141A26">did not improve CDAI vs placebo at week</text><text x="664" y="157" font-size="11" fill="#141A26">6 in moderate-to-severe Crohn&#39;s disease…</text></g><g data-finding="F2" tabindex="0"><title>F2 (opposes, observation): Published report concluded IL-17A blockade with secukinumab was ineffective in active Crohn&#39;s disease, with more adverse events (including infections, with fungal infections only on drug) than placebo.</title><rect x="650" y="182" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.2"/><rect x="650" y="192" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="664" y="201" font-size="10" font-weight="600" fill="#525AFF" letter-spacing="0.06em">F2 · OPPOSES · observation</text><text x="664" y="217" font-size="11" fill="#141A26">Published report concluded IL-17A</text><text x="664" y="230" font-size="11" fill="#141A26">blockade with secukinumab was</text><text x="664" y="243" font-size="11" fill="#141A26">ineffective in active Crohn&#39;s disease…</text></g><g data-finding="F3" tabindex="0"><title>F3 (opposes, observation): Case series report new-onset or worsening IBD in patients treated with IL-17 inhibitors (including secukinumab) for psoriasis/spondyloarthritis, suggesting a possible protective role of IL-17A in the gut. Causality is not established.</title><rect x="650" y="268" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.2"/><rect x="650" y="278" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="664" y="287" font-size="10" font-weight="600" fill="#525AFF" letter-spacing="0.06em">F3 · OPPOSES · observation</text><text x="664" y="303" font-size="11" fill="#141A26">Case series report new-onset or</text><text x="664" y="316" font-size="11" fill="#141A26">worsening IBD in patients treated with</text><text x="664" y="329" font-size="11" fill="#141A26">IL-17 inhibitors (including secukinumab…</text></g><g data-finding="F4" tabindex="0"><title>F4 (context, observation): Open Targets gives a low overall IL17A–Crohn disease association (0.1), driven mainly by literature (0.503), with modest clinical (0.137) and RNA expression (0.126) evidence. This is a ranking, not a probability of success.</title><rect x="455" y="240" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.2"/><rect x="455" y="250" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="469" y="259" font-size="10" font-weight="600" fill="#6D8BC0" letter-spacing="0.06em">F4 · CONTEXT · observation</text><text x="469" y="275" font-size="11" fill="#141A26">Open Targets gives a low overall</text><text x="469" y="288" font-size="11" fill="#141A26">IL17A–Crohn disease association (0.1),</text><text x="469" y="301" font-size="11" fill="#141A26">driven mainly by literature (0.503)…</text></g><g data-finding="F5" tabindex="0"><title>F5 (context, observation): Secukinumab is an IL-17A inhibitor antibody with max phase 4 overall (approved for psoriasis, PsA, AS), but Crohn&#39;s disease max phase is 2. Phase reflects development stage, not efficacy in Crohn&#39;s.</title><rect x="455" y="326" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.2"/><rect x="455" y="336" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="469" y="345" font-size="10" font-weight="600" fill="#6D8BC0" letter-spacing="0.06em">F5 · CONTEXT · observation</text><text x="469" y="361" font-size="11" fill="#141A26">Secukinumab is an IL-17A inhibitor</text><text x="469" y="374" font-size="11" fill="#141A26">antibody with max phase 4 overall</text><text x="469" y="387" font-size="11" fill="#141A26">(approved for psoriasis, PsA, AS), but…</text></g><g data-finding="F6" tabindex="0"><title>F6 (context, interpretation): An experimental 2.6 Å crystal structure of secukinumab Fv bound to human IL-17A is available (PDB 9SFX), so target engagement by this antibody is structurally characterized.</title><rect x="455" y="412" width="250" height="70" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.2"/><rect x="455" y="422" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="469" y="431" font-size="10" font-weight="600" fill="#6D8BC0" letter-spacing="0.06em">F6 · CONTEXT · interpretation</text><text x="469" y="447" font-size="11" fill="#141A26">An experimental 2.6 Å crystal structure</text><text x="469" y="460" font-size="11" fill="#141A26">of secukinumab Fv bound to human IL-17A</text><text x="469" y="473" font-size="11" fill="#141A26">is available (PDB 9SFX), so target…</text></g><g data-group="ot:ENSG00000112115:MONDO_0005011"><title>ot:ENSG00000112115:MONDO_0005011</title><rect x="24" y="252" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="38" y="271" font-size="11" font-weight="600" fill="#141A26">Open Targets</text><text x="38" y="286" font-size="10" fill="#4A5468">Open Targets</text></g><g data-group="chembl:CHEMBL1743068"><title>chembl:CHEMBL1743068</title><rect x="24" y="338" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="38" y="357" font-size="11" font-weight="600" fill="#141A26">CHEMBL1743068</text><text x="38" y="372" font-size="10" fill="#4A5468">ChEMBL</text></g><g data-group="pdb:9SFX"><title>pdb:9SFX</title><rect x="24" y="424" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="38" y="443" font-size="11" font-weight="600" fill="#141A26">PDB 9SFX</text><text x="38" y="458" font-size="10" fill="#4A5468">RCSB PDB, 2025</text></g><g data-group="C1"><title>C1</title><rect x="956" y="151" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="970" y="170" font-size="11" font-weight="600" fill="#141A26">C1</text><text x="970" y="185" font-size="10" fill="#4A5468"></text></g><g data-group="pmcid:PMC7958765"><title>pmcid:PMC7958765</title><rect x="956" y="280" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="970" y="299" font-size="11" font-weight="600" fill="#141A26">pmcid:PMC7958765</text><text x="970" y="314" font-size="10" fill="#4A5468">Europe PMC, 2021</text></g></svg>