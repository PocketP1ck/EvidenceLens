<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 656" width="1160" height="656" role="img" aria-labelledby="em-title em-desc" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif"><title id="em-title">Evidence map: IL-23 p19 blockade (risankizumab) in Crohn&#39;s disease</title><desc id="em-desc">3 supporting, 1 opposing and 2 context findings linked to 5 distinct studies or records.</desc><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="40" font-size="13" font-weight="600" fill="#141A26" letter-spacing="0.08em">EVIDENCE MAP</text><text x="40" y="60" font-size="12" fill="#4A5468">Hypothesis → findings → sources. Records sharing a PMID, NCT, DOI or protocol ID are merged into one study node.</text><text x="40" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#4AB5B5">SUPPORTS · 3</text><text x="430" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#6D8BC0">CONTEXT · 2</text><text x="820" y="222" font-size="10.5" font-weight="700" letter-spacing="0.12em" fill="#525AFF">OPPOSES · 1</text><path d="M580,160 C580,183 110,183 110,206" fill="none" stroke="#4AB5B5" stroke-width="1.4" opacity="0.6"/><path d="M580,160 C580,183 500,183 500,206" fill="none" stroke="#6D8BC0" stroke-width="1.4" opacity="0.6"/><path d="M580,160 C580,183 890,183 890,206" fill="none" stroke="#525AFF" stroke-width="1.4" opacity="0.6"/><path d="M340,273 H352 V504 C352,537 156,537 156,570" fill="none" stroke="#4AB5B5" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F1"/><path d="M340,361 H352 V504 C352,537 368,537 368,570" fill="none" stroke="#4AB5B5" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F3"/><path d="M730,273 H742 V416 C742,493 580,493 580,570" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F2"/><path d="M340,449 H352 V504 C352,537 792,537 792,570" fill="none" stroke="#4AB5B5" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F4"/><path d="M1120,273 H1132 V328 C1132,449 792,449 792,570" fill="none" stroke="#525AFF" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F5"/><path d="M730,361 H742 V416 C742,493 1004,493 1004,570" fill="none" stroke="#6D8BC0" stroke-width="1" stroke-dasharray="3 3" opacity="0.65" data-finding="F6"/><g data-node="hypothesis"><rect x="380" y="84" width="400" height="76" rx="14" fill="#FFFFFF" stroke="#141A26" stroke-width="1.2"/><text x="398" y="106" font-size="10" letter-spacing="0.12em" fill="#4A5468">HYPOTHESIS</text><text x="762" y="106" font-size="10.5" font-weight="700" letter-spacing="0.1em" text-anchor="end" fill="#4AB5B5">SUPPORTED</text><text x="398" y="128" font-size="13.5" font-weight="600" fill="#141A26">IL-23 p19 blockade (risankizumab) in Crohn&#39;s disease</text></g><g data-finding="F1" tabindex="0"><title>F1 (supports, observation): Open Targets gives a moderate IL23A–Crohn disease association score (0.61), driven almost entirely by clinical-stage evidence (0.99); literature 0.245 and RNA expression 0.043 are low.</title><rect x="40" y="236" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#4AB5B5" stroke-width="1.1"/><rect x="40" y="248" width="3" height="50" rx="1.5" fill="#4AB5B5"/><text x="56" y="256" font-size="10" font-weight="700" fill="#4AB5B5" letter-spacing="0.06em">F1<tspan font-weight="500" fill="#4A5468" dx="8">observation · not applicable</tspan></text><text x="56" y="273" font-size="11.2" fill="#141A26">Open Targets gives a moderate IL23A–Crohn</text><text x="56" y="286.5" font-size="11.2" fill="#141A26">disease association score (0.61), driven almost</text><text x="56" y="300" font-size="11.2" fill="#141A26">entirely by clinical-stage evidence (0.99)…</text></g><g data-finding="F3" tabindex="0"><title>F3 (supports, observation): Phase 3 ADVANCE and MOTIVATE induction trials (IV risankizumab 600/1200 mg vs placebo, weeks 0/4/8) met all co-primary endpoints at week 12 (clinical remission and endoscopic response) in moderate-to-severe Crohn&#39;s disease; in MOTIVATE (biologic-failure population) CDAI remission was 42%/40% vs 20% placebo and endoscopic response 29%/34% vs 11%.</title><rect x="40" y="324" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#4AB5B5" stroke-width="1.1"/><rect x="40" y="336" width="3" height="50" rx="1.5" fill="#4AB5B5"/><text x="56" y="344" font-size="10" font-weight="700" fill="#4AB5B5" letter-spacing="0.06em">F3<tspan font-weight="500" fill="#4A5468" dx="8">observation · positive</tspan></text><text x="56" y="361" font-size="11.2" fill="#141A26">Phase 3 ADVANCE and MOTIVATE induction trials</text><text x="56" y="374.5" font-size="11.2" fill="#141A26">(IV risankizumab 600/1200 mg vs placebo, weeks</text><text x="56" y="388" font-size="11.2" fill="#141A26">0/4/8) met all co-primary endpoints at week 12…</text></g><g data-finding="F4" tabindex="0"><title>F4 (supports, observation): In the FORTIFY randomised withdrawal maintenance trial (SC risankizumab q8w, induction responders), 360 mg beat placebo withdrawal at week 52 for CDAI remission (52% vs 41%) and endoscopic response (47% vs 22%).</title><rect x="40" y="412" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#4AB5B5" stroke-width="1.1"/><rect x="40" y="424" width="3" height="50" rx="1.5" fill="#4AB5B5"/><text x="56" y="432" font-size="10" font-weight="700" fill="#4AB5B5" letter-spacing="0.06em">F4<tspan font-weight="500" fill="#4A5468" dx="8">observation · positive</tspan></text><text x="56" y="449" font-size="11.2" fill="#141A26">In the FORTIFY randomised withdrawal maintenance</text><text x="56" y="462.5" font-size="11.2" fill="#141A26">trial (SC risankizumab q8w, induction</text><text x="56" y="476" font-size="11.2" fill="#141A26">responders), 360 mg beat placebo withdrawal at…</text></g><g data-finding="F2" tabindex="0"><title>F2 (context, observation): Risankizumab is an IL-23 inhibitor antibody acting on IL-23 (including p19/IL23A, Q9NPF7); ChEMBL max phase 4 overall (first approval 2019) with Crohn&#39;s disease listed at max phase 3 in this record.</title><rect x="430" y="236" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.1"/><rect x="430" y="248" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="446" y="256" font-size="10" font-weight="700" fill="#6D8BC0" letter-spacing="0.06em">F2<tspan font-weight="500" fill="#4A5468" dx="8">observation · not applicable</tspan></text><text x="446" y="273" font-size="11.2" fill="#141A26">Risankizumab is an IL-23 inhibitor antibody</text><text x="446" y="286.5" font-size="11.2" fill="#141A26">acting on IL-23 (including p19/IL23A, Q9NPF7);</text><text x="446" y="300" font-size="11.2" fill="#141A26">ChEMBL max phase 4 overall (first approval 2019…</text></g><g data-finding="F6" tabindex="0"><title>F6 (context, interpretation): No experimental structure of risankizumab bound to IL23A was found; an AlphaFold model of IL23A (mean pLDDT 80.56) was selected, which is structural confidence only and not disease relevance.</title><rect x="430" y="324" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1.1"/><rect x="430" y="336" width="3" height="50" rx="1.5" fill="#6D8BC0"/><text x="446" y="344" font-size="10" font-weight="700" fill="#6D8BC0" letter-spacing="0.06em">F6<tspan font-weight="500" fill="#4A5468" dx="8">interpretation · not applicable</tspan></text><text x="446" y="361" font-size="11.2" fill="#141A26">No experimental structure of risankizumab bound</text><text x="446" y="374.5" font-size="11.2" fill="#141A26">to IL23A was found; an AlphaFold model of IL23A</text><text x="446" y="388" font-size="11.2" fill="#141A26">(mean pLDDT 80.56) was selected, which is…</text></g><g data-finding="F5" tabindex="0"><title>F5 (opposes, observation): Not all benefit is large or uniform: in FORTIFY, the 180 mg dose did not significantly beat withdrawal on stool-frequency/abdominal-pain remission (p=0.124), and the absolute remission gain vs placebo in induction (~15–22 points) leaves most patients not in remission; the most common AEs included worsening Crohn&#39;s disease.</title><rect x="820" y="236" width="300" height="74" rx="10" fill="#FFFFFF" stroke="#525AFF" stroke-width="1.1"/><rect x="820" y="248" width="3" height="50" rx="1.5" fill="#525AFF"/><text x="836" y="256" font-size="10" font-weight="700" fill="#525AFF" letter-spacing="0.06em">F5<tspan font-weight="500" fill="#4A5468" dx="8">observation · null</tspan></text><text x="836" y="273" font-size="11.2" fill="#141A26">Not all benefit is large or uniform: in FORTIFY,</text><text x="836" y="286.5" font-size="11.2" fill="#141A26">the 180 mg dose did not significantly beat</text><text x="836" y="300" font-size="11.2" fill="#141A26">withdrawal on stool-frequency/abdominal-pain…</text></g><g data-group="ot:ENSG00000110944:MONDO_0005011"><title>ot:ENSG00000110944:MONDO_0005011</title><rect x="58" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="76" y="589" font-size="11" font-weight="600" fill="#141A26">Open Targets</text><text x="76" y="604" font-size="10" fill="#4A5468">Open Targets</text></g><g data-group="C1"><title>ctgov:NCT03104413, pmid:35644154</title><rect x="270" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#6D8BC0" stroke-width="1"/><text x="288" y="589" font-size="11" font-weight="600" fill="#141A26">NCT03104413 · one study</text><text x="288" y="604" font-size="10" fill="#4A5468">+ PMID 35644154</text></g><g data-group="chembl:CHEMBL3990029"><title>chembl:CHEMBL3990029</title><rect x="482" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="500" y="589" font-size="11" font-weight="600" fill="#141A26">CHEMBL3990029</text><text x="500" y="604" font-size="10" fill="#4A5468">ChEMBL</text></g><g data-group="pmid:35644155"><title>pmid:35644155</title><rect x="694" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="712" y="589" font-size="11" font-weight="600" fill="#141A26">PMID 35644155</text><text x="712" y="604" font-size="10" fill="#4A5468">Europe PMC, 2022</text></g><g data-group="alphafold:AF-Q9NPF7-F1"><title>alphafold:AF-Q9NPF7-F1</title><rect x="906" y="570" width="196" height="46" rx="23" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="1"/><text x="924" y="589" font-size="11" font-weight="600" fill="#141A26">AF-Q9NPF7-F1</text><text x="924" y="604" font-size="10" fill="#4A5468">AlphaFold DB</text></g></svg>